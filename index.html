<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>徒歩圏内ラーメン〜近い順が見えるぞ〜</title>
<meta name="description" content="現在地から近い順にラーメン屋を表示。営業中かどうか、ジャンル、Google評価とレビュー件数で並び替えもできます。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f7ead3;
    background-image: repeating-linear-gradient(45deg, rgba(179,53,44,.035) 0 10px, transparent 10px 20px);
    color: #3b2a1e; line-height: 1.5;
  }
  /* のれん風ヘッダー：縦に割れた布の見た目 */
  .noren {
    display: flex; justify-content: center; gap: 6px;
    background: #8f241d; padding: 10px 12px 0;
  }
  .noren span {
    background: #b3352c; color: #fff8ee; font-size: 13px; letter-spacing: .3em;
    padding: 6px 10px 12px; border-radius: 3px 3px 0 0;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
  }
  header {
    background: linear-gradient(180deg, #b3352c 0%, #9c2b24 100%);
    color: #fff8ee; text-align: center; padding: 4px 16px 22px;
  }
  header .steam { font-size: 20px; letter-spacing: .5em; opacity: .85; }
  header h1 { font-size: 26px; font-weight: 800; line-height: 1.35; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  header p { font-size: 14px; margin-top: 8px; opacity: .93; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }
  #searchBtn {
    display: block; width: 100%; padding: 17px; font-size: 19px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, #ef8a35, #dd6f1a);
    border: none; border-radius: 16px;
    box-shadow: 0 4px 0 #a94f0f, 0 6px 14px rgba(120,60,10,.28);
    cursor: pointer;
  }
  #searchBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a94f0f; }
  #searchBtn:disabled { opacity: .6; }
  #status { text-align: center; margin: 14px 0 4px; font-size: 15px; min-height: 1.5em; }
  .summary { text-align: center; font-size: 13.5px; color: #6b5a44; margin-top: 2px; }
  .summary b { color: #1e8e4f; }
  .sorts { display: none; gap: 8px; margin: 14px 0 6px; }
  .sorts.show { display: flex; }
  .sorts button {
    flex: 1; padding: 11px 4px; font-size: 14px; font-weight: 700;
    border: 2px solid #b3352c; border-radius: 999px; background: #fff; color: #b3352c; cursor: pointer;
  }
  .sorts button.on { background: #b3352c; color: #fff; }
  .filter { display: none; margin: 8px 0 2px; text-align: center; }
  .filter.show { display: block; }
  .filter label {
    display: inline-block; font-size: 14px; font-weight: 700; color: #3b2a1e;
    background: #fff; border: 2px solid #d9a05a; border-radius: 999px; padding: 7px 16px; cursor: pointer;
  }
  .filter input { accent-color: #1e8e4f; width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  .card {
    display: flex; gap: 12px; background: #fff; border-radius: 16px;
    box-shadow: 0 3px 10px rgba(90,50,20,.16); padding: 14px 16px; margin-bottom: 12px;
    border-left: 6px solid #8a8a8a;
  }
  .card.st-open { border-left-color: #1e8e4f; }
  .card.st-before { border-left-color: #e07b2a; }
  .rank {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%;
    background: #b3352c; color: #fff; font-size: 15px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; margin-top: 2px;
  }
  .card-body { flex: 1; min-width: 0; }
  .card h2 { font-size: 19px; line-height: 1.35; }
  .badges { margin: 7px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .b-open { background: #1e8e4f; color: #fff; }
  .b-before { background: #e07b2a; color: #fff; }
  .b-closed { background: #8a8a8a; color: #fff; }
  .b-unknown { background: #e8e0d2; color: #6b5a44; }
  .b-genre { background: #f6e3c8; color: #8a5a17; }
  .meta { font-size: 15px; }
  .meta .dist { font-weight: 800; color: #b3352c; font-size: 17px; }
  .meta .rating { color: #d97a06; font-weight: 700; }
  .addr { font-size: 13.5px; color: #6b5a44; margin-top: 3px; }
  .maplink {
    display: inline-block; margin-top: 10px; font-size: 14px; font-weight: 700; color: #fff;
    background: #1a6fd4; text-decoration: none; padding: 7px 14px; border-radius: 999px;
  }
  .ad { background: #fff; border: 1.5px dashed #d9a05a; border-radius: 14px; padding: 14px 16px; margin-top: 20px; }
  .ad .pr { font-size: 11.5px; color: #8a7a5f; }
  .ad a { color: #b3352c; font-weight: 700; }
  footer { text-align: center; font-size: 12px; color: #8a7a5f; padding: 0 16px 28px; }
</style>
</head>
<body>
<div class="noren" aria-hidden="true"><span>ら</span><span>ー</span><span>め</span><span>ん</span></div>
<header>
  <div class="steam" aria-hidden="true">〜〜〜</div>
  <h1>徒歩圏内ラーメン<br>〜近い順が見えるぞ〜</h1>
  <p>現在地から近い順にラーメン屋が出ます。営業中かどうかも一目で分かります。</p>
</header>
<main>
  <button id="searchBtn">🍜 近くのラーメンを探す</button>
  <div id="status"></div>
  <div class="summary" id="summary"></div>
  <div class="sorts" id="sorts">
    <button data-sort="dist" class="on">📍 近い順</button>
    <button data-sort="count">💬 レビュー件数順</button>
    <button data-sort="rating">★ Google評価順</button>
  </div>
  <div class="filter" id="filter"><label><input type="checkbox" id="openOnly">営業中の店だけ表示</label></div>
  <div id="list"></div>
  <div class="ad">
    <div class="pr">PR（楽天アフィリエイト）</div>
    <p>家で名店の味を。<a href="https://hb.afl.rakuten.co.jp/ichiba/123a3938.caa38400.123a3939.a479f0af/?pc=https%3A%2F%2Fsearch.rakuten.co.jp%2Fsearch%2Fmall%2F%25E3%2583%25A9%25E3%2583%25BC%25E3%2583%25A1%25E3%2583%25B3%2B%25E3%2581%258A%25E5%258F%2596%25E3%2582%258A%25E5%25AF%2584%25E3%2581%259B%2F" target="_blank" rel="noopener sponsored">楽天市場でお取り寄せラーメンを探す</a></p>
  </div>
</main>
<footer>店舗データ：Google Maps Platform（Places API）</footer>
<script>
const API_KEY = "AIzaSyBwidVt_6unH4gYGQ0GFFvQUWVWOGeeFyk";
const statusEl = document.getElementById('status');
const summaryEl = document.getElementById('summary');
const listEl = document.getElementById('list');
const sortsEl = document.getElementById('sorts');
const filterEl = document.getElementById('filter');
const openOnlyEl = document.getElementById('openOnly');
const btn = document.getElementById('searchBtn');
let shops = [];
let sortMode = 'dist';

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function genreOf(name, summary) {
  const t = (name || '') + ' ' + (summary || '');
  const rules = [
    ['二郎系', /二郎/], ['家系', /家系/], ['博多系', /博多|長浜|久留米/],
    ['ちゃん系', /ちゃん系|ちゃんぽん/], ['鶏白湯', /鶏白湯/], ['担々麺', /担々|担担|タンタン/],
    ['つけ麺', /つけ麺|つけめん/], ['油そば・まぜそば', /油そば|まぜそば|汁なし/],
    ['味噌', /味噌|みそ/], ['塩', /塩ラーメン|しお/], ['背脂', /背脂/], ['魚介系', /魚介|煮干/]
  ];
  for (const [g, re] of rules) if (re.test(t)) return g;
  return null;
}

function statusOf(p) {
  const h = p.currentOpeningHours;
  if (!h || typeof h.openNow !== 'boolean') return { cls: 'b-unknown', label: '営業時間は不明', key: 'unknown' };
  if (h.openNow) return { cls: 'b-open', label: '営業中', key: 'open' };
  const now = new Date();
  const day = now.getDay();
  const periods = (h.periods || []).filter(x => x.open);
  let opensTodayLater = false;
  for (const per of periods) {
    if (per.open.day === day) {
      const openDate = new Date(now); openDate.setHours(per.open.hour, per.open.minute, 0, 0);
      if (openDate > now) opensTodayLater = true;
    }
  }
  if (opensTodayLater) return { cls: 'b-before', label: 'オープン前', key: 'before' };
  const hasToday = periods.some(x => x.open.day === day);
  return { cls: 'b-closed', label: hasToday ? '営業時間外' : '本日は営業なし', key: 'closed' };
}

async function searchPlaces(lat, lng, radius) {
  const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': API_KEY,
      'X-Goog-FieldMask': 'places.displayName,places.formattedAddress,places.location,places.rating,places.userRatingCount,places.currentOpeningHours,places.googleMapsUri,places.editorialSummary'
    },
    body: JSON.stringify({
      textQuery: 'ラーメン',
      languageCode: 'ja',
      regionCode: 'JP',
      pageSize: 20,
      locationBias: { circle: { center: { latitude: lat, longitude: lng }, radius: radius } }
    })
  });
  if (!res.ok) throw new Error('api ' + res.status);
  const data = await res.json();
  return data.places || [];
}

function render() {
  let sorted = [...shops];
  if (sortMode === 'dist') sorted.sort((a, b) => a.dist - b.dist);
  if (sortMode === 'count') sorted.sort((a, b) => (b.userRatingCount || 0) - (a.userRatingCount || 0));
  if (sortMode === 'rating') sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
  if (openOnlyEl.checked) sorted = sorted.filter(p => statusOf(p).key === 'open');
  listEl.innerHTML = sorted.map((p, i) => {
    const st = statusOf(p);
    const genre = genreOf(p.displayName && p.displayName.text, p.editorialSummary && p.editorialSummary.text);
    const km = p.dist >= 1000 ? (p.dist / 1000).toFixed(1) + 'km' : Math.round(p.dist) + 'm';
    const walk = Math.max(1, Math.round(p.dist / 80));
    const rating = p.rating ? '★' + p.rating.toFixed(1) + '（' + (p.userRatingCount || 0) + '件）' : '評価なし';
    const cardCls = st.key === 'open' ? 'st-open' : (st.key === 'before' ? 'st-before' : '');
    return '<div class="card ' + cardCls + '"><div class="rank">' + (i + 1) + '</div><div class="card-body"><h2>' + escapeHtml(p.displayName ? p.displayName.text : '名称不明') + '</h2>' +
      '<div class="badges"><span class="badge ' + st.cls + '">' + st.label + '</span>' +
      (genre ? '<span class="badge b-genre">' + genre + '</span>' : '') + '</div>' +
      '<div class="meta"><span class="dist">' + km + '・徒歩約' + walk + '分</span>　<span class="rating">' + rating + '</span></div>' +
      '<div class="addr">' + escapeHtml(p.formattedAddress || '') + '</div>' +
      (p.googleMapsUri ? '<a class="maplink" href="' + p.googleMapsUri + '" target="_blank" rel="noopener">Googleマップで見る →</a>' : '') +
      '</div></div>';
  }).join('');
  const openCount = shops.filter(p => statusOf(p).key === 'open').length;
  summaryEl.innerHTML = shops.length ? 'この中で今すぐ入れるのは <b>' + openCount + '件</b> です' : '';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

sortsEl.addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  sortMode = e.target.dataset.sort;
  sortsEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === e.target));
  render();
});

openOnlyEl.addEventListener('change', render);

btn.addEventListener('click', () => {
  if (!navigator.geolocation) { statusEl.textContent = 'このブラウザでは現在地が使えません。'; return; }
  btn.disabled = true;
  statusEl.textContent = '現在地を取得しています…';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    statusEl.textContent = '近くのラーメン屋を探しています…';
    try {
      let places = await searchPlaces(lat, lng, 1000);
      if (places.length < 5) places = await searchPlaces(lat, lng, 2000);
      shops = places.map(p => ({ ...p, dist: haversine(lat, lng, p.location.latitude, p.location.longitude) }))
                     .filter(p => p.dist <= 2100);
      if (!shops.length) {
        statusEl.textContent = '徒歩圏内にラーメン屋が見つかりませんでした。';
        sortsEl.classList.remove('show');
        filterEl.classList.remove('show');
        listEl.innerHTML = '';
        summaryEl.textContent = '';
      } else {
        statusEl.textContent = shops.length + '件見つかりました';
        sortsEl.classList.add('show');
        filterEl.classList.add('show');
        render();
      }
    } catch (e) {
      statusEl.textContent = '地図データを取得できませんでした。少し待ってからもう一度試してください。';
    }
    btn.disabled = false;
  }, () => {
    statusEl.textContent = '現在地が読み込めませんでした。位置情報の許可を確認してください。';
    btn.disabled = false;
  }, { enableHighAccuracy: true, timeout: 15000 });
});
</script>
</body>
</html>
